name: R5 Node CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/react-refactor-r5-parity-cutover

permissions:
  contents: read

jobs:
  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate
          pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests, and production build
        run: pnpm run verify:all

      - name: Verify scoped routing migration and atomic rollback
        run: |
          python3 scripts/test-prepare-seo-nginx.py
          python3 scripts/test-promote-r5-site.py
          bash -n scripts/promote-r5-site.sh
          node --check scripts/deploy-r5-release.mjs

      - name: Save checked production preview for browser verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: r5-preview-${{ github.sha }}
          path: dist/
          # The Vite manifest is part of the hashed preview, not a secret file.
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
