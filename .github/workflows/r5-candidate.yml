name: R5 React Production Candidate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/react-refactor-r5-parity-cutover
    tags:
      - 'react-refactor-r5-candidate-v3'
      - 'react-refactor-r5-parity-repair-candidate'
      - 'react-refactor-r5-parity-repair-candidate-v2'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate
          pnpm install --frozen-lockfile

      - name: Root quality and production build
        run: pnpm run verify:all

      - name: Install release browsers
        run: pnpm -C app exec playwright install --with-deps chrome webkit

      - name: Production browser matrix
        run: pnpm -C app exec playwright test --config playwright.release.config.ts

      - name: Harness contract regression
        run: pnpm -C app exec playwright test

      - name: Rebuild identity-bound deployable artifact
        if: github.ref == 'refs/tags/react-refactor-r5-candidate-v3' || github.ref == 'refs/tags/react-refactor-r5-parity-repair-candidate' || github.ref == 'refs/tags/react-refactor-r5-parity-repair-candidate-v2'
        env:
          R5_CANDIDATE_TAG: ${{ github.ref_name }}
          R5_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm run deploy:build

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/tags/react-refactor-r5-candidate-v3' || github.ref == 'refs/tags/react-refactor-r5-parity-repair-candidate' || github.ref == 'refs/tags/react-refactor-r5-parity-repair-candidate-v2'
        with:
          name: r5-candidate-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
