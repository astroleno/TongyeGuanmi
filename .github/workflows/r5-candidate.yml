name: R5 Node CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/react-refactor-r5-parity-cutover

permissions:
  contents: read

jobs:
  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate
          pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests, and production build
        run: pnpm run verify:all
