name: R5 Media Asset Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/*.webm'
      - 'assets/**/*.webm'
      - 'app/scripts/homepage-media-contract.mjs'
      - 'app/scripts/verify-homepage-media-deep.mjs'
      - '.github/workflows/r5-media-assets.yml'
  push:
    branches:
      - '**'
    paths:
      - 'assets/*.webm'
      - 'assets/**/*.webm'
      - 'app/scripts/homepage-media-contract.mjs'
      - 'app/scripts/verify-homepage-media-deep.mjs'
      - '.github/workflows/r5-media-assets.yml'

permissions:
  contents: read

jobs:
  asset-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.1 --activate

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version

      - name: Deep media qualification
        run: pnpm run verify:media:deep
