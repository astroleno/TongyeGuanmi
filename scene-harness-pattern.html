<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Scene Player Harness</title>
  <meta name="description" content="Standalone Pattern scene-player bloom harness." />
  <meta name="theme-color" content="#d9c08f" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/patterns/backgrounds/aged-mottled-background-16x9-4k.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-06.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-05.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-04.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-03.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-02.png" as="image" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #d9c08f;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #221815;
    }

    button,
    input {
      font: inherit;
    }

    .pattern-harness {
      position: relative;
      min-height: 100svh;
      background: #d9c08f;
    }

    .pattern-harness__host {
      position: fixed;
      inset: 0;
    }

    .pattern-harness__controls,
    .pattern-harness__state {
      position: fixed;
      z-index: 20;
      border: 1px solid rgba(34, 24, 21, 0.14);
      border-radius: 8px;
      background: rgba(245, 229, 184, 0.70);
      box-shadow: 0 18px 50px rgba(34, 24, 21, 0.12);
      backdrop-filter: blur(18px) saturate(1.12);
    }

    .pattern-harness__controls {
      left: 28px;
      bottom: 28px;
      display: grid;
      grid-template-columns: repeat(5, max-content);
      gap: 8px;
      max-width: calc(100vw - 56px);
      padding: 8px;
    }

    .pattern-harness__controls button {
      min-height: 38px;
      border: 1px solid rgba(34, 24, 21, 0.14);
      border-radius: 7px;
      padding: 0 12px;
      color: rgba(34, 24, 21, 0.88);
      background: rgba(255, 248, 221, 0.52);
      cursor: pointer;
    }

    .pattern-harness__progress {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 88px minmax(180px, 1fr) 46px;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 0 8px;
      color: rgba(34, 24, 21, 0.68);
      font-size: 12px;
    }

    .pattern-harness__progress input {
      width: 100%;
      accent-color: #8f2e23;
    }

    .pattern-harness__state {
      right: 28px;
      bottom: 28px;
      min-width: min(380px, calc(100vw - 56px));
      padding: 10px 12px;
      color: rgba(34, 24, 21, 0.68);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .pattern-harness__controls {
        left: 16px;
        right: 16px;
        bottom: 88px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: none;
      }

      .pattern-harness__controls button {
        width: 100%;
      }

      .pattern-harness__state {
        left: 16px;
        right: 16px;
        bottom: 16px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="pattern-harness" aria-label="Pattern scene player harness">
    <section class="pattern-harness__host" data-pattern-harness-host aria-label="Pattern scene viewport"></section>
    <div class="pattern-harness__controls" aria-label="Harness controls">
      <button type="button" data-action="final">Final</button>
      <button type="button" data-action="forward">Play Forward</button>
      <button type="button" data-action="cancel">Cancel To Source</button>
      <button type="button" data-action="cancel-final">Cancel To Final</button>
      <button type="button" data-action="reverse">Reverse To Source</button>
      <button type="button" data-action="destroy">Destroy</button>
      <button type="button" data-action="mount">Mount</button>
      <label class="pattern-harness__progress">
        <span>Progress</span>
        <input type="range" min="0" max="1" value="1" step="0.001" data-progress-control disabled />
        <span data-progress-label>1.000</span>
      </label>
    </div>
    <output class="pattern-harness__state" data-pattern-harness-state aria-live="polite"></output>
  </main>

  <script type="module">
    import { createPatternScenePlayer } from './js/scene-harness/pattern-scene-player.js';

    const host = document.querySelector('[data-pattern-harness-host]');
    const output = document.querySelector('[data-pattern-harness-state]');
    const progressControl = document.querySelector('[data-progress-control]');
    const progressLabel = document.querySelector('[data-progress-label]');
    const buttons = new Map([...document.querySelectorAll('[data-action]')].map((button) => [button.dataset.action, button]));
    let player = null;
    let unsubscribe = () => {};

    function setShot(name) {
      document.documentElement.dataset.screenshotState = name;
    }

    function syncProgressControl(progress) {
      const value = Number(progress).toFixed(3);
      progressControl.value = value;
      progressLabel.textContent = value;
    }

    function updateShot(state) {
      if (state.phase === 'final') setShot('pattern-stable');
      if (state.phase === 'source' || state.phase === 'destroyed' || state.phase === 'unmounted') setShot('pattern-cleanup');
      if ((state.phase === 'playing' || state.phase === 'reversing') && state.progress > 0.16 && state.progress < 0.84) {
        setShot('pattern-bloom-mid');
      }
    }

    function syncButtons(state) {
      const phase = state.phase;
      buttons.get('mount').disabled = player && phase !== 'destroyed' && phase !== 'unmounted';
      buttons.get('final').disabled = phase !== 'source' && phase !== 'final';
      buttons.get('forward').disabled = !['source', 'final', 'reversing'].includes(phase);
      buttons.get('cancel').disabled = !['playing', 'reversing'].includes(phase);
      buttons.get('cancel-final').disabled = !['playing', 'reversing'].includes(phase);
      buttons.get('reverse').disabled = !['final', 'playing'].includes(phase);
      buttons.get('destroy').disabled = !player || phase === 'destroyed' || phase === 'unmounted';
    }

    function renderState(snapshot = player?.getState() || { phase: 'destroyed', progress: 0, runId: 0, mounted: false, ready: false }) {
      syncProgressControl(snapshot.progress);
      syncButtons(snapshot);
      updateShot(snapshot);
      output.value = `phase=${snapshot.phase} run=${snapshot.runId} progress=${snapshot.progress.toFixed(3)} mounted=${snapshot.mounted} ready=${snapshot.ready}`;
      output.textContent = output.value;
    }

    function createPlayer() {
      unsubscribe();
      player = createPatternScenePlayer({
        durations: {
          bloomIn: 8000,
          reverseToSource: 900
        }
      });
      unsubscribe = player.subscribe(renderState);
      renderState();
      return player;
    }

    async function mountPlayer() {
      const nextPlayer = player && player.getState().phase !== 'destroyed' ? player : createPlayer();
      if (!nextPlayer.getState().mounted) await nextPlayer.mount({ host });
      renderState();
      return nextPlayer;
    }

    function runCommand(command) {
      void (async () => {
        const nextPlayer = await mountPlayer();
        const result = nextPlayer.dispatch(command);
        if (result?.then) await result;
        renderState();
      })().catch((error) => {
        console.error(error);
      });
    }

    function showFinal() {
      runCommand('SHOW_FINAL');
    }

    function playForward() {
      runCommand('PLAY');
    }

    function cancelToSource() {
      runCommand('CANCEL_TO_SOURCE');
    }

    function cancelToFinal() {
      runCommand('CANCEL_TO_FINAL');
    }

    function reverseToSource() {
      runCommand('REVERSE');
    }

    function destroyPlayer() {
      player?.destroy();
      unsubscribe();
      unsubscribe = () => {};
      player = null;
      host.replaceChildren();
      renderState();
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'final') showFinal();
        if (action === 'forward') playForward();
        if (action === 'cancel') cancelToSource();
        if (action === 'cancel-final') cancelToFinal();
        if (action === 'reverse') reverseToSource();
        if (action === 'destroy') destroyPlayer();
        if (action === 'mount') mountPlayer();
      });
    });

    window.patternSceneHarness = {
      mountPlayer,
      showFinal,
      playForward,
      cancelToSource,
      cancelToFinal,
      reverseToSource,
      destroyPlayer,
      getState: () => player?.getState() || { phase: 'destroyed', progress: 0, runId: 0, mounted: false, ready: false }
    };

    mountPlayer();
  </script>
</body>
</html>
