server {
    listen 80;
    listen [::]:80;
    server_name tongye.me www.tongye.me;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tongye.me/acme;
    }

    return 301 https://tongye.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tongye.me;

    ssl_certificate /www/server/panel/vhost/cert/tongye.me/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tongye.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TongyeSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://tongye.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tongye.me;

    root /www/wwwroot/tongye.me/current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/tongye.me/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tongye.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TongyeSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /release-id.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /r5-release-manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/tongye.me.log;
    error_log /www/wwwlogs/tongye.me.error.log;
}
