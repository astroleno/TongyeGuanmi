<!doctype html>
<html lang="__SITE_LANGUAGE__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="theme-color" content="#040807" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="../assets/fonts/qiji-title-subset.ttf" as="font" type="font/ttf" crossorigin />
    <link id="phone-first-art" rel="preload" href="../assets/hero-back.webp" as="image" crossorigin fetchpriority="high" media="not all" />
    <!--__SEO_HEAD__-->
    <!--__R5_CDN_RUNTIME__-->
    <title>__SITE_TITLE__</title>
    <script>
      try {
        const viewport = window.visualViewport;
        const viewportWidth = Math.max(1, viewport?.width ?? window.innerWidth);
        const viewportHeight = Math.max(1, viewport?.height ?? window.innerHeight);
        const phoneCapabilities = window.matchMedia('(pointer: coarse)').matches
          && window.matchMedia('(hover: none)').matches;
        const phoneGeometry = (viewportHeight > viewportWidth && viewportWidth <= 600)
          || (viewportWidth > viewportHeight && viewportHeight <= 500);
        const phoneShellEntry = location.pathname === '/brand-lab'
          || (phoneCapabilities && phoneGeometry);
        if (phoneShellEntry) {
          const documentElement = document.documentElement;
          documentElement.dataset.phonePreboot = 'pending';
          documentElement.style.setProperty('--phone-preboot-surface', '#040807');
          if (location.pathname === '/' && ['', '#home', '#hero'].includes(location.hash)) {
            const firstArt = document.getElementById('phone-first-art');
            if (firstArt) firstArt.media = 'all';
          }
        }
      } catch {}
    </script>
    <style>
      /* This must precede the application stylesheet: the pre-hydration
       * cover can hand over before Vite has applied the route stylesheet. */
      html[data-phone-preboot] .static-content { display: none !important; }
      html[data-phone-preboot] :is(.loading-screen, .story-loader),
      html[data-phone-preboot],
      html[data-phone-preboot] body,
      html[data-phone-preboot] #root {
        background: var(--phone-preboot-surface, #040807) !important;
      }
      .story-loader::before,
      .story-loader::after {
        position: fixed;
        inset: auto max(20px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        z-index: 6;
        max-width: 420px;
        margin: auto;
        color: rgba(247, 237, 215, .72);
        font: 600 12px/1.4 system-ui, sans-serif;
        letter-spacing: .14em;
        pointer-events: none;
      }
      .story-loader::before {
        content: '同野观幂';
        padding-bottom: 10px;
        background:
          linear-gradient(#e9d8a6 0 0) 0 100% / 6% 1px no-repeat,
          linear-gradient(rgba(247, 237, 215, .16) 0 0) 0 100% / 100% 1px no-repeat;
        animation: story-loader-progress 3.18s linear forwards;
      }
      .story-loader::after {
        content: '正在展开现场';
        padding-bottom: 10px;
        color: rgba(247, 237, 215, .54);
        text-align: right;
      }
      .story-loader--static::before { animation-duration: 8s; }
      .story-loader[data-loader-status="exiting"]::before { background-size: 100% 1px, 100% 1px; }
      @keyframes story-loader-progress { to { background-size: 94% 1px, 100% 1px; } }
      @media (prefers-reduced-motion: reduce) {
        .story-loader::before { background-size: 86% 1px, 100% 1px; animation: none; }
      }
    </style>
  </head>
  <body>
    <div
      id="story-loader-static"
      class="story-loader story-loader--static loading-screen"
      data-story-loader-static="true"
      data-loader-ink-fallback="true"
      data-loader-status="running"
      aria-hidden="true"
    ></div>
    <noscript><style>#story-loader-static { display: none !important; }</style></noscript>
    <div id="root"></div>
    <!--__STATIC_STORY_CONTENT__-->
    <script>
      (() => {
        const selector = '[data-static-primary-heading="true"]';
        const syncStaticHeading = () => {
          const source = document.querySelector(selector);
          const targetTag = document.documentElement.dataset.storyHydrated === 'true' ? 'p' : 'h1';
          if (!source || source.tagName.toLowerCase() === targetTag) return;
          const replacement = document.createElement(targetTag);
          for (const attribute of source.attributes) {
            replacement.setAttribute(attribute.name, attribute.value);
          }
          while (source.firstChild) replacement.append(source.firstChild);
          source.replaceWith(replacement);
        };
        new MutationObserver(syncStaticHeading).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-story-hydrated']
        });
        syncStaticHeading();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
