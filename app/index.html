<!doctype html>
<html lang="__SITE_LANGUAGE__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="theme-color" content="#07110e" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="../assets/fonts/qiji-title-subset.ttf" as="font" type="font/ttf" crossorigin />
    <!--__CANONICAL_LINK__-->
    <!--__R5_CDN_RUNTIME__-->
    <title>__SITE_TITLE__</title>
    <script>
      try {
        const validationVersion = new URLSearchParams(location.search).get('v');
        const validationNumber = Number(validationVersion);
        const validationPhoneEntry =
          (Number.isInteger(validationNumber)
            && validationNumber >= 16
            && validationNumber <= 40)
          || validationNumber === 42
          || validationNumber === 43
          || validationNumber === 44
          || validationNumber === 45
          || validationNumber === 46
          || validationNumber === 47;
        const viewport = window.visualViewport;
        const viewportWidth = Math.max(1, viewport?.width ?? window.innerWidth);
        const viewportHeight = Math.max(1, viewport?.height ?? window.innerHeight);
        const phoneCapabilities = window.matchMedia('(pointer: coarse)').matches
          && window.matchMedia('(hover: none)').matches;
        const phoneGeometry = (viewportHeight > viewportWidth && viewportWidth <= 600)
          || (viewportWidth > viewportHeight && viewportHeight <= 500);
        const productionPhoneEntry = '__PHONE_STORY_PREBOOT_ENABLED__' === 'true'
          && phoneCapabilities
          && phoneGeometry;
        if (validationPhoneEntry || productionPhoneEntry) {
          // Hide the static document before React resolves the phone shell.
          // Without this synchronous route marker, the static brand can flash
          // between the preload cover and the authored eight-character Loader.
          const documentElement = document.documentElement;
          documentElement.dataset.portraitSpike = 'b';
          documentElement.dataset.portraitSpikePreboot = validationPhoneEntry
            ? 'validation'
            : 'production';
          documentElement.dataset.portraitEdgeScene = 'hero';
          documentElement.style.setProperty('--portrait-document-surface', '#07110e');
          const completed = sessionStorage.getItem('tongye:portrait-spike:v16:loader-complete') === 'true';
          const hiddenAt = Number(sessionStorage.getItem('tongye:portrait-spike:v16:hidden-at'));
          const age = Date.now() - hiddenAt;
          const navigation = performance.getEntriesByType?.('navigation')?.[0];
          const manuallyReloaded = navigation?.type === 'reload'
            || performance.navigation?.type === 1;
          if (completed && hiddenAt > 0 && age >= 0 && age < 30 * 60 * 1000) {
            const resumeHash = sessionStorage.getItem(
              'tongye:portrait-spike:v16:resume-hash'
            );
            if (resumeHash && /^#[a-z0-9-]+$/.test(resumeHash)) {
              history.replaceState(
                history.state,
                '',
                `${location.pathname}${location.search}${resumeHash}`
              );
              documentElement.dataset.portraitResumeHash = resumeHash;
            }
            documentElement.dataset.portraitLoaderResume = 'skip';
            sessionStorage.removeItem('tongye:portrait-spike:v16:hidden-at');
          } else if (manuallyReloaded) {
            // A visible manual refresh has no recent hidden marker and still
            // owns the cold Loader. Safari lock-screen reloads reach the
            // recovery branch above before this navigation-type diagnostic.
            sessionStorage.removeItem('tongye:portrait-spike:v16:hidden-at');
          }
        }
      } catch {}
    </script>
    <style>
      /* This must precede the application stylesheet: the pre-hydration
       * cover can hand over before Vite has applied the route stylesheet. */
      html[data-portrait-spike="b"] .static-content { display: none !important; }
      html[data-portrait-spike="b"],
      html[data-portrait-spike="b"] body,
      html[data-portrait-spike="b"] #root {
        background: var(--portrait-document-surface, #07110e) !important;
      }
    </style>
  </head>
  <body>
    <div
      id="story-loader-static"
      class="story-loader story-loader--static loading-screen"
      data-story-loader-static="true"
      data-loader-ink-fallback="true"
      data-loader-status="running"
      aria-live="polite"
      aria-label="正在进入同人于野，观象知幂"
    >
      <div
        class="story-loader__word loader-word"
        data-story-loader-static-cover="blank"
        aria-hidden="true"
      ></div>
    </div>
    <noscript><style>#story-loader-static { display: none !important; }</style></noscript>
    <div id="root"></div>
    <!--__STATIC_STORY_CONTENT__-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
