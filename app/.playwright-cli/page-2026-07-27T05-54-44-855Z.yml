  - list "同野观幂 AI 落地五步" [ref=f6e26]:
    - listitem [ref=f6e27]:
      - generic [ref=f6e28]: "01"
      - heading "识场" [level=3] [ref=f6e29]
      - paragraph [ref=f6e30]: 先摸清最耗人、最容易断的环节：老师傅一走就带走的本事，先理出来；哪笔钱花得冤，先算清楚。不瞎铺摊子。
    - listitem [ref=f6e31]:
      - generic [ref=f6e32]: "02"
      - heading "立法" [level=3] [ref=f6e33]
      - paragraph [ref=f6e34]: 给团队定一套能看懂、敢用的规矩。怎么问 AI、什么能信、哪些数据碰不得，先讲清楚，团队才敢用，也不乱用。
    - listitem [ref=f6e35]:
      - generic [ref=f6e36]: "03"
      - heading "共创" [level=3] [ref=f6e37]
      - paragraph [ref=f6e38]: 拉上你、你的中层和一线老员工一起设计。流程得让一线认账，不然做得再漂亮也推不动。
    - listitem [ref=f6e39]:
      - generic [ref=f6e40]: "04"
      - heading "成器" [level=3] [ref=f6e41]
      - paragraph [ref=f6e42]: 把摸索出来的东西沉淀成模板、专属 AI 助手、知识库和自动流程。人走了，本事留在公司里。
    - listitem [ref=f6e43]:
      - generic [ref=f6e44]: "05"
      - heading "陪跑" [level=3] [ref=f6e45]
      - paragraph [ref=f6e46]: 交付完不是结束。我们盯着用没用、好不好用，持续调、持续教，直到 AI 长进团队的日常。
