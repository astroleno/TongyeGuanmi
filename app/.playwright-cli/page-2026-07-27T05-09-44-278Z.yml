        - paragraph [ref=e99]: 落到现场
        - paragraph [ref=e100]: 先看账，
        - paragraph [ref=e101]: 再定工具。
        - paragraph [ref=e102]: 我们把场景拆成可判断的小题，不听概念，先看钱、单、人、货和流程。
        - paragraph [ref=e103]: "01"
        - paragraph [ref=e104]: 选型与决策
        - paragraph [ref=e105]: 报价、方案、招人，分不清谁靠谱？我们陪你把账算清，你只管拍板。
        - paragraph [ref=e106]: "02"
        - paragraph [ref=e107]: 知识管理
        - paragraph [ref=e108]: 老师傅一走，本事就带走了？把团队经验存成 AI 随时能调的活资产。
        - paragraph [ref=e109]: "03"
        - paragraph [ref=e110]: 电商投放
        - paragraph [ref=e111]: 素材、投放、客资连成一条线，钱花出去几个小时就知道值不值，不用等一个月。
        - paragraph [ref=e112]: "04"
        - paragraph [ref=e113]: 销售增长
        - paragraph [ref=e114]: 摸透客户、磨好话术、给没成交的线索自动备好材料，让销售把时间花在成单上。
        - paragraph [ref=e115]: "05"
        - paragraph [ref=e116]: 运营提效
        - paragraph [ref=e117]: 天天重复的对账单、走流程、回消息，交给 AI 自动跑，省下的人去干更值钱的活。
        - paragraph [ref=e118]: "06"
        - paragraph [ref=e119]: 供应链与采购
        - paragraph [ref=e120]: 比价、合同跟踪、库存预警这些琐碎盯梢，交给 AI 看着，账目更清爽。
      - generic [ref=e121]:
        - heading "你为生意请的这套 AI 打法，也能用在孩子身上。" [level=2] [ref=e122]
        - paragraph [ref=e123]: 先会用
        - paragraph [ref=e124]: 资料 · 研究 · 表达
        - paragraph [ref=e125]: 再出海
        - paragraph [ref=e126]: 课堂 · 申请 · 竞争
        - paragraph [ref=e127]: 给企业家的延伸服务
        - paragraph [ref=e128]: 先会用，
        - paragraph [ref=e129]: 再出海。
        - paragraph [ref=e130]: 很多老板做着做着会问一句，孩子出国，是不是也该会用这些工具？答案是会。查资料、做研究、写申请、适应海外课堂，用当下的工具，准备当下的竞争。
        - paragraph [ref=e131]: "01"
        - paragraph [ref=e132]: AI 工具使用
        - paragraph [ref=e133]: 让孩子掌握一套属于自己的高效 AI 学习方法：查资料、读东西、做展示这些事先用顺手，比同龄人快一截。
        - paragraph [ref=e134]: "02"
        - paragraph [ref=e135]: 研究项目
        - paragraph [ref=e136]: 把孩子的一个兴趣，做成一个拿得出手的研究项目，申请材料里就有了别人没有的东西。
        - paragraph [ref=e137]: "03"
        - paragraph [ref=e138]: 申请表达
        - paragraph [ref=e139]: 把零散的经历和想法理出一条清楚的主线，让孩子的个人故事真正打动招生官。
        - paragraph [ref=e140]: "04"
        - paragraph [ref=e141]: 海外学习准备
        - paragraph [ref=e142]: 提前练好大学要用的查资料、小组协作、课堂表达，出去不慌，也不掉队。
      - generic [ref=e143]:
        - heading "START FROM THE FIELD" [level=2] [ref=e144]
        - paragraph [ref=e145]: 把你拿不准的那个决定，先拿出来聊。
        - paragraph [ref=e146]: 带上一个正在耗人耗钱的环节、一场谈不拢的管理层会，或者孩子的留学规划。我们先帮你拆成看得懂、落得了地的下一步。一次现场诊断你会拿到三样东西：哪个环节值得上 AI、先后顺序、大概要投入多少。真要做，也是先挑一个环节小做，几天内见到能跑的东西，再谈要不要扩大。聊完再决定要不要合作，不推销、不卖课。
