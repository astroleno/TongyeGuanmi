<aside class="master-observer-hud" data-master-observer-hud hidden inert aria-hidden="true" aria-label="Master timeline observer">
  <header class="master-observer-hud__header">
    <span>MASTER OBSERVER</span>
    <button type="button" data-master-observer-marker>Mark</button>
  </header>
  <dl class="master-observer-hud__grid">
    <div><dt>mode</dt><dd data-master-observer-field="mode">inactive</dd></div>
    <div><dt>section</dt><dd data-master-observer-field="section">unavailable</dd></div>
    <div><dt>transition</dt><dd data-master-observer-field="transition">unavailable</dd></div>
    <div><dt>scroll</dt><dd data-master-observer-field="scroll">0 / 0%</dd></div>
    <div><dt>direction</dt><dd data-master-observer-field="direction">forward</dd></div>
    <div><dt>component</dt><dd data-master-observer-field="component">unavailable</dd></div>
    <div><dt>videos</dt><dd data-master-observer-field="videos">unavailable</dd></div>
    <div><dt>copy</dt><dd data-master-observer-field="copy">unavailable</dd></div>
    <div><dt>scrolltrigger</dt><dd data-master-observer-field="scrolltrigger">unavailable</dd></div>
    <div><dt>marker</dt><dd data-master-observer-field="marker">none</dd></div>
  </dl>
</aside>
