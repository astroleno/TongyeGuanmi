<section class="canvas-section canvas-section--contact" id="contact">
  <div class="canvas-track contact-endpoint reveal">
    <span class="eyebrow">START FROM THE FIELD</span>
    <h2>把你拿不准的那个决定，先拿出来聊。</h2>
    <p>带上一个正在耗人耗钱的环节、一场谈不拢的管理层会，或者孩子的留学规划。我们先帮你拆成看得懂、落得了地的下一步。一次现场诊断你会拿到三样东西：哪个环节值得上 AI、先后顺序、大概要投入多少。真要做，也是先挑一个环节小做，几天内见到能跑的东西，再谈要不要扩大。聊完再决定要不要合作，不推销、不卖课。</p>
    <div class="contact-actions">
      <a class="btn btn-primary magnetic" href="#contact-request">约一次 AI 现场诊断</a>
      <a class="text-link magnetic" href="#top">回到首屏</a>
    </div>
    <form class="contact-request" id="contact-request" aria-label="AI 现场诊断需求摘要">
      <label>
        <span>你想先拆的业务现场</span>
        <textarea name="field" rows="3" placeholder="" required></textarea>
      </label>
      <label>
        <span>怎么联系你</span>
        <input name="contact" type="text" autocomplete="email" placeholder="" required />
      </label>
      <button class="btn btn-primary" type="submit">发送需求摘要</button>
    </form>
  </div>
</section>
