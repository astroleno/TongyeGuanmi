<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure 2 Fresco Preview｜同野观幂</title>
  <meta name="description" content="Figure 2 白色浮雕层和彩色壁画层合成预览。" />
  <meta name="theme-color" content="#15120d" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/qiji-title-subset.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/figure2-middle-white-source.png" as="image" />
  <link rel="preload" href="assets/figure2-middle-color-source.png" as="image" />
  <link rel="preload" href="assets/figure2-front-white-source.png" as="image" />
  <link rel="preload" href="assets/arch2b-alpha.png" as="image" />
  <link rel="preload" href="assets/figure2-duel-alpha-reverse-lite.webm" as="video" type="video/webm" />
  <link rel="stylesheet" href="css/figure2-fresco-preview.css" />
</head>
<body class="fresco-page">
  <main class="fresco-route" data-fresco-root>
    <section class="fresco-stage" aria-label="Figure 2 fresco layer preview">
      <div class="fresco-scene">
        <div class="fresco-middle-stack" aria-hidden="true">
          <img class="fresco-layer fresco-middle-base" src="assets/figure2-middle-white-source.png" alt="" />
          <img class="fresco-layer fresco-middle-color" src="assets/figure2-middle-color-source.png" alt="" />
          <img class="fresco-layer fresco-middle-relief" src="assets/figure2-middle-white-source.png" alt="" />
        </div>

        <div class="fresco-warmth" aria-hidden="true"></div>
        <div class="fresco-air" aria-hidden="true"></div>

        <div class="fresco-front-stack" aria-hidden="true">
          <img class="fresco-front-layer fresco-front-white" src="assets/figure2-front-white-source.png" alt="" />
          <img class="fresco-front-layer fresco-front-color" src="assets/arch2b-alpha.png" alt="" />
          <img class="fresco-front-layer fresco-front-relief" src="assets/figure2-front-white-source.png" alt="" />
        </div>

        <div class="fresco-contact-shadow" aria-hidden="true"></div>
        <figure class="fresco-figure" aria-label="子问老子人物预览">
          <video
            class="fresco-figure-video"
            data-alpha-src="assets/figure2-duel-alpha-reverse-lite.webm"
            data-fallback-src="assets/figure2-duel-reverse-lite.mp4"
            poster="assets/figure2-duel-alpha-reverse-lite-poster.png"
            muted
            loop
            autoplay
            playsinline
            webkit-playsinline
            preload="auto"
          ></video>
          <figcaption>子问老子</figcaption>
        </figure>

        <div class="fresco-edge-light" aria-hidden="true"></div>
        <div class="fresco-texture" aria-hidden="true"></div>
        <div class="fresco-vignette" aria-hidden="true"></div>
      </div>

      <aside class="fresco-panel" aria-label="Fresco preview controls">
        <div class="fresco-panel-head">
          <strong>Fresco Mix</strong>
          <button type="button" data-reset>Reset</button>
        </div>
        <label class="fresco-control">
          <span>中景白底 <output>100%</output></span>
          <input data-fresco-var="middle-base-opacity" type="range" min="0" max="1" step="0.01" value="1" />
        </label>
        <label class="fresco-control">
          <span>中景颜色 <output>35%</output></span>
          <input data-fresco-var="middle-color-opacity" type="range" min="0" max="1" step="0.01" value="0.35" />
        </label>
        <label class="fresco-control">
          <span>中景浮雕 <output>22%</output></span>
          <input data-fresco-var="middle-relief-opacity" type="range" min="0" max="1" step="0.01" value="0.22" />
        </label>
        <label class="fresco-control">
          <span>前景白底 <output>78%</output></span>
          <input data-fresco-var="front-white-opacity" type="range" min="0" max="1" step="0.01" value="0.78" />
        </label>
        <label class="fresco-control">
          <span>前景彩绘 <output>28%</output></span>
          <input data-fresco-var="front-color-opacity" type="range" min="0" max="1" step="0.01" value="0.28" />
        </label>
        <label class="fresco-control">
          <span>前景浮雕 <output>24%</output></span>
          <input data-fresco-var="front-relief-opacity" type="range" min="0" max="1" step="0.01" value="0.24" />
        </label>
        <label class="fresco-control">
          <span>暖灰统一 <output>32%</output></span>
          <input data-fresco-var="warmth-opacity" type="range" min="0" max="0.7" step="0.01" value="0.32" />
        </label>
        <label class="fresco-control">
          <span>空气雾 <output>15%</output></span>
          <input data-fresco-var="air-opacity" type="range" min="0" max="0.6" step="0.01" value="0.15" />
        </label>
        <label class="fresco-control">
          <span>墙面颗粒 <output>18%</output></span>
          <input data-fresco-var="texture-opacity" type="range" min="0" max="0.6" step="0.01" value="0.18" />
        </label>
        <label class="fresco-control">
          <span>脚下阴影 <output>34%</output></span>
          <input data-fresco-var="shadow-opacity" type="range" min="0" max="0.7" step="0.01" value="0.34" />
        </label>
        <label class="fresco-control">
          <span>人物强度 <output>100%</output></span>
          <input data-fresco-var="figure-opacity" type="range" min="0.45" max="1" step="0.01" value="1" />
        </label>
      </aside>
    </section>
  </main>

  <script type="module" src="js/figure2-fresco-preview.js"></script>
</body>
</html>
