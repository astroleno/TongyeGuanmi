<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to the God｜同野观幂</title>
  <meta name="description" content="同野观幂 Talk to the God 分层滚动场景。" />
  <meta name="theme-color" content="#080d10" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="js/vendor/gsap.min.js" as="script" />
  <link rel="preload" href="js/vendor/ScrollTrigger.min.js" as="script" />
  <link rel="preload" href="js/vendor/lenis.min.js" as="script" />
  <link rel="preload" href="assets/ttg_bg.png" as="image" />
  <link rel="preload" href="assets/ttg_middle-alpha.png" as="image" />
  <link rel="preload" href="assets/ttg_middle-original-overlay-alpha.png" as="image" />
  <link rel="preload" href="assets/ttg_front-alpha.png?v=ttg-front-painting-2" as="image" />
  <link rel="preload" href="assets/ttg_front-original-overlay-alpha.png?v=ttg-front-painting-2" as="image" />
  <link rel="preload" href="assets/ttg_figure-alpha-scrub.webm" as="video" type="video/webm" />
  <link rel="preload" href="assets/ttg_figure-alpha-scrub-poster.png" as="image" />
  <link rel="preload" href="assets/ttg-complete.png" as="image" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/ttg.css" />
</head>
<body class="ttg-page">
  <div class="grain" aria-hidden="true"></div>
  <main class="ttg-route">
    <h1 class="ttg-sr-only">Talk to the God</h1>
    <section class="ttg-scroll" data-ttg-stage aria-label="Talk to the God visual scene">
      <div class="ttg-sticky">
        <div class="ttg-field">
          <div class="ttg-paper" aria-hidden="true"></div>
          <div class="ttg-layer-stack" aria-hidden="true">
            <img class="ttg-layer ttg-layer--bg" src="assets/ttg_bg.png" alt="" />
            <img class="ttg-layer ttg-layer--middle" src="assets/ttg_middle-alpha.png" alt="" />
            <img class="ttg-layer ttg-layer--middle-overlay" src="assets/ttg_middle-original-overlay-alpha.png" alt="" />
            <img class="ttg-layer ttg-layer--front" src="assets/ttg_front-alpha.png?v=ttg-front-painting-2" alt="" />
            <img class="ttg-layer ttg-layer--front-overlay" src="assets/ttg_front-original-overlay-alpha.png?v=ttg-front-painting-2" alt="" />
            <video
              class="ttg-layer ttg-layer--figure"
              data-ttg-figure-video
              src="assets/ttg_figure-alpha-scrub.webm"
              poster="assets/ttg_figure-alpha-scrub-poster.png"
              width="720"
              height="1280"
              muted
              preload="auto"
              playsinline
              webkit-playsinline
            ></video>
          </div>
          <div class="ttg-moon-wash" aria-hidden="true"></div>
          <div class="ttg-vignette" aria-hidden="true"></div>
          <div class="ttg-progress" aria-hidden="true">
            <span></span>
          </div>
          <div class="ttg-tune-panel" data-ttg-tune-panel>
            <div class="ttg-tune-panel__title">TTG Panel</div>
            <label class="ttg-tune-control">
              <span>预览进度 <output data-ttg-tune-output="previewProgress">scroll</output></span>
              <input data-ttg-tune-key="previewProgress" type="range" min="-0.01" max="1" step="0.01" value="-0.01" />
            </label>
            <label class="ttg-tune-control">
              <span>近景位移 <output data-ttg-tune-output="frontTravelVh">4.6vh</output></span>
              <input data-ttg-tune-key="frontTravelVh" type="range" min="-16" max="18" step="0.1" value="4.6" />
            </label>
            <label class="ttg-tune-control">
              <span>建筑位移 <output data-ttg-tune-output="middleTravelVh">10.5vh</output></span>
              <input data-ttg-tune-key="middleTravelVh" type="range" min="-20" max="28" step="0.1" value="10.5" />
            </label>
            <label class="ttg-tune-control">
              <span>建筑响应 <output data-ttg-tune-output="middleResponse">0.34</output></span>
              <input data-ttg-tune-key="middleResponse" type="range" min="0.04" max="0.80" step="0.01" value="0.34" />
            </label>
            <label class="ttg-tune-control">
              <span>背景位移 <output data-ttg-tune-output="bgTravelVh">4.2vh</output></span>
              <input data-ttg-tune-key="bgTravelVh" type="range" min="0" max="18" step="0.1" value="4.2" />
            </label>
            <label class="ttg-tune-control">
              <span>人物比例 <output data-ttg-tune-output="figureScale">0.52x</output></span>
              <input data-ttg-tune-key="figureScale" type="range" min="0.35" max="0.90" step="0.01" value="0.52" />
            </label>
            <label class="ttg-tune-control">
              <span>人物Y <output data-ttg-tune-output="figureYVh">2.0vh</output></span>
              <input data-ttg-tune-key="figureYVh" type="range" min="-16" max="16" step="0.1" value="2" />
            </label>
            <label class="ttg-tune-control">
              <span>滚动高度 <output data-ttg-tune-output="scrollVh">140vh</output></span>
              <input data-ttg-tune-key="scrollVh" type="range" min="110" max="260" step="1" value="140" />
            </label>
            <button class="ttg-tune-reset" data-ttg-tune-reset type="button">重置</button>
          </div>
          <noscript>
            <img class="ttg-noscript" src="assets/ttg-complete.png" alt="" />
          </noscript>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/ttg-scroll.js?v=ttg-panel-4"></script>
</body>
</html>
