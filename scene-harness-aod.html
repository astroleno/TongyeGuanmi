<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AOD Scene Harness | Tongye Guanmi</title>
  <meta name="theme-color" content="#ede4d2" />
  <link rel="preload" href="assets/aod_cloud-alpha.png" as="image" />
  <link rel="preload" href="assets/aod_sun-alpha.png" as="image" />
  <link rel="preload" href="assets/aod_figure-alpha-front-scrub.webm" as="video" type="video/webm" />
  <link rel="preload" href="assets/aod-paper-bg.png" as="image" />
  <link rel="stylesheet" href="css/aod-transition.css" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ede4d2;
      color: #252719;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(76% 58% at 34% 22%, rgba(255, 255, 255, .76), rgba(255, 255, 255, 0) 72%),
        #ede4d2;
    }

    button {
      font: inherit;
    }

    .scene-harness-aod {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
    }

    .scene-harness-aod__stage {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background: #fff;
    }

    .scene-harness-aod__host {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #fff;
    }

    .scene-harness-aod__host .aod-transition {
      --aod-transition-section-height: 100%;
      --aod-transition-section-min-height: 100%;
      height: 100%;
      min-height: 100%;
    }

    .scene-harness-aod__host .aod-transition__sticky {
      position: absolute;
      inset: 0;
      height: 100%;
      min-height: 0;
    }

    .scene-harness-aod__host .aod-transition__figure-video {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .scene-harness-aod__host .aod-transition__progress {
      display: block;
      left: max(24px, 4vw);
      right: max(24px, 4vw);
      bottom: 22px;
      background: rgba(37, 39, 25, .12);
    }

    .scene-harness-aod__badge {
      position: absolute;
      z-index: 12;
      left: clamp(18px, 4vw, 56px);
      top: clamp(18px, 4vw, 48px);
      display: grid;
      gap: 4px;
      max-width: min(360px, calc(100% - 36px));
      padding: 13px 15px;
      border: 1px solid rgba(120, 99, 41, .26);
      border-radius: 8px;
      background: rgba(237, 228, 210, .74);
      box-shadow: 0 18px 52px rgba(37, 39, 25, .12);
      opacity: 0;
      transform: translate3d(0, -8px, 0);
      transition: opacity .22s ease, transform .22s ease;
      pointer-events: none;
      backdrop-filter: blur(18px);
    }

    .scene-harness-aod__stage.is-early-copy-ready .scene-harness-aod__badge {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .scene-harness-aod__badge strong {
      color: #786329;
      font-size: 11px;
      font-weight: 780;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .scene-harness-aod__badge span {
      color: rgba(37, 39, 25, .86);
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: clamp(22px, 2.4vw, 34px);
      line-height: 1.02;
    }

    .scene-harness-aod__panel {
      position: relative;
      z-index: 20;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 18px;
      padding: 26px;
      border-left: 1px solid rgba(37, 39, 25, .12);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .72), rgba(237, 228, 210, .92)),
        url("assets/aod-paper-bg.png") center / cover;
      box-shadow: -18px 0 46px rgba(37, 39, 25, .08);
    }

    .scene-harness-aod__title {
      display: grid;
      gap: 8px;
    }

    .scene-harness-aod__title h1 {
      margin: 0;
      color: rgba(37, 39, 25, .94);
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 30px;
      font-weight: 620;
      line-height: 1.03;
      letter-spacing: 0;
    }

    .scene-harness-aod__title p {
      margin: 0;
      color: rgba(37, 39, 25, .62);
      font-size: 13px;
      line-height: 1.58;
    }

    .scene-harness-aod__status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .scene-harness-aod__metric {
      display: grid;
      gap: 5px;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid rgba(37, 39, 25, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .52);
    }

    .scene-harness-aod__metric span {
      color: rgba(37, 39, 25, .52);
      font-size: 11px;
      font-weight: 720;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .scene-harness-aod__metric strong {
      overflow-wrap: anywhere;
      color: rgba(37, 39, 25, .9);
      font-size: 16px;
      font-weight: 720;
      line-height: 1.2;
    }

    .scene-harness-aod__meter {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(37, 39, 25, .12);
    }

    .scene-harness-aod__meter span {
      display: block;
      width: 100%;
      height: 100%;
      transform: scaleX(var(--aod-panel-progress, 0));
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #416b63, #dfaa45, #9e5132);
    }

    .scene-harness-aod__controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .scene-harness-aod__controls button {
      min-height: 40px;
      border: 1px solid rgba(37, 39, 25, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .58);
      color: rgba(37, 39, 25, .9);
      font-size: 13px;
      font-weight: 720;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .scene-harness-aod__controls button:hover {
      border-color: rgba(120, 99, 41, .42);
      background: rgba(255, 255, 255, .82);
      transform: translate3d(0, -1px, 0);
    }

    .scene-harness-aod__controls button:disabled {
      cursor: not-allowed;
      opacity: .48;
      transform: none;
    }

    .scene-harness-aod__controls button[data-action="play"] {
      background: #252719;
      color: #f8f2e4;
      border-color: #252719;
    }

    .scene-harness-aod__trace {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .scene-harness-aod__trace h2 {
      margin: 0;
      color: rgba(37, 39, 25, .72);
      font-size: 12px;
      font-weight: 780;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .scene-harness-aod__trace-list {
      min-height: 220px;
      max-height: calc(100dvh - 440px);
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid rgba(37, 39, 25, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .46);
      color: rgba(37, 39, 25, .76);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .scene-harness-aod {
        grid-template-columns: 1fr;
      }

      .scene-harness-aod__stage {
        min-height: 68dvh;
      }

      .scene-harness-aod__panel {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid rgba(37, 39, 25, .12);
      }

      .scene-harness-aod__trace-list {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <main class="scene-harness-aod">
    <section class="scene-harness-aod__stage" data-aod-harness-stage aria-label="AOD visual stage">
      <div class="scene-harness-aod__host" data-aod-harness-host></div>
      <div class="scene-harness-aod__badge" data-aod-early-copy-badge aria-live="polite">
        <strong>early-copy-ready</strong>
        <span>method-top</span>
      </div>
    </section>

    <aside class="scene-harness-aod__panel" aria-label="AOD scene harness controls">
      <header class="scene-harness-aod__title">
        <h1>AOD Scene Harness</h1>
        <p>Standalone player contract: poster gate first, explicit playback, 80% early-copy trace, cleanup-safe recovery.</p>
      </header>

      <section class="scene-harness-aod__status" aria-label="Scene state">
        <div class="scene-harness-aod__metric">
          <span>State</span>
          <strong data-aod-state>idle</strong>
        </div>
        <div class="scene-harness-aod__metric">
          <span>Progress</span>
          <strong data-aod-progress-label>0%</strong>
        </div>
      </section>

      <div class="scene-harness-aod__meter" aria-hidden="true">
        <span data-aod-progress-bar></span>
      </div>

      <section class="scene-harness-aod__controls" aria-label="Harness actions">
        <button type="button" data-action="mount-only">Mount Only</button>
        <button type="button" data-action="poster">Show Poster</button>
        <button type="button" data-action="play">Play Forward</button>
        <button type="button" data-action="cancel">Cancel</button>
        <button type="button" data-action="reverse">Reverse Poster</button>
        <button type="button" data-action="reject">Sim Reject</button>
        <button type="button" data-action="destroy">Destroy</button>
      </section>

      <section class="scene-harness-aod__trace" aria-label="Trace panel">
        <h2>Trace</h2>
        <pre class="scene-harness-aod__trace-list" data-aod-trace></pre>
      </section>
    </aside>
  </main>

  <script type="module">
    import { createAodScenePlayer } from './js/scene-harness/aod-scene-player.js';

    const host = document.querySelector('[data-aod-harness-host]');
    const stage = document.querySelector('[data-aod-harness-stage]');
    const stateLabel = document.querySelector('[data-aod-state]');
    const progressLabel = document.querySelector('[data-aod-progress-label]');
    const progressBar = document.querySelector('[data-aod-progress-bar]');
    const tracePanel = document.querySelector('[data-aod-trace]');
    const buttons = [...document.querySelectorAll('[data-action]')];
    const harnessManifest = {
      earlyCopyTarget: 'method-top'
    };

    let player = null;
    let traceEntries = [];
    let playController = null;

    function appendTrace(entry) {
      if (traceEntries.some((item) => item.seq === entry.seq && item.type === entry.type && item.at === entry.at)) return;
      traceEntries.push(entry);
      traceEntries = traceEntries.slice(-80);
      renderTrace();
    }

    function renderTrace() {
      tracePanel.textContent = traceEntries.map((entry) => {
        const suffix = entry.type === 'early-copy-ready' ? ` -> ${harnessManifest.earlyCopyTarget}` : '';
        const reason = entry.reason ? ` (${entry.reason})` : '';
        return `${String(entry.seq).padStart(2, '0')} ${entry.type}${suffix}${reason} p=${entry.progress}`;
      }).join('\n');
      tracePanel.scrollTop = tracePanel.scrollHeight;
    }

    function renderState() {
      const snapshot = player?.getState?.() || { state: 'idle', progress: 0, earlyCopyFired: false };
      stateLabel.textContent = snapshot.state;
      progressLabel.textContent = `${Math.round(snapshot.progress * 100)}%`;
      progressBar.parentElement.style.setProperty('--aod-panel-progress', snapshot.progress);
      stage.classList.toggle('is-early-copy-ready', Boolean(snapshot.earlyCopyFired));
      buttons.forEach((button) => {
        button.disabled = snapshot.state === 'playing-forward' && button.dataset.action !== 'cancel';
      });
    }

    function createPlayer({ simulateReject = false } = {}) {
      player?.destroy?.();
      traceEntries = [];
      playController = null;

      const deps = simulateReject
        ? { playVideo: () => Promise.reject(new Error('Simulated play reject')) }
        : {};

      player = createAodScenePlayer({
        deps,
        onTrace(entry) {
          appendTrace(entry);
          renderState();
        }
      });
      renderState();
      renderTrace();
    }

    async function mountAndPoster() {
      await player.mount({ host });
      await player.showPoster({ direction: 'forward' });
      renderState();
    }

    async function boot() {
      createPlayer();
      await mountAndPoster();
    }

    async function playForward() {
      playController?.abort();
      playController = new AbortController();
      try {
        await player.playForward({
          signal: playController.signal,
          onProgress: renderState,
          onTrace(entry) {
            appendTrace(entry);
            renderState();
          }
        });
      } catch (error) {
        appendTrace({
          seq: 999,
          type: 'playForward-caught',
          state: player.getState().state,
          progress: player.getState().progress,
          at: Math.round(performance.now()),
          reason: error.message
        });
      } finally {
        playController = null;
        renderState();
      }
    }

    async function runAction(action) {
      if (!player) createPlayer();
      try {
        if (action === 'mount-only') {
          createPlayer();
          await player.mount({ host });
        } else if (action === 'poster') {
          await player.showPoster({ direction: 'forward' });
        } else if (action === 'play') {
          await playForward();
        } else if (action === 'cancel') {
          playController?.abort();
          await player.cancelToSource({});
        } else if (action === 'reverse') {
          await player.reverseToPoster({});
        } else if (action === 'reject') {
          createPlayer({ simulateReject: true });
          await mountAndPoster();
          await playForward();
        } else if (action === 'destroy') {
          player.destroy();
        }
      } finally {
        renderState();
      }
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        runAction(button.dataset.action);
      });
    });

    boot();
  </script>
</body>
</html>
