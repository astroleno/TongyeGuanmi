<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shader Blob Glass Preview</title>
  <link rel="stylesheet" href="css/components/shader-blob-glass.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: "SF Pro Display", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #f7edd7;
      background:
        radial-gradient(circle at 14% 18%, rgba(249, 239, 191, 0.72), transparent 13vw),
        radial-gradient(circle at 82% 20%, rgba(225, 170, 91, 0.66), transparent 18vw),
        radial-gradient(circle at 25% 78%, rgba(110, 211, 188, 0.68), transparent 20vw),
        radial-gradient(circle at 66% 60%, rgba(211, 141, 183, 0.46), transparent 19vw),
        linear-gradient(135deg, #08130f 0%, #25362f 34%, #aeb4a8 68%, #f1ecdf 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        radial-gradient(circle at 20% 42%, rgba(0, 0, 0, 0.34), transparent 20vw),
        radial-gradient(circle at 84% 76%, rgba(0, 0, 0, 0.24), transparent 20vw);
      background-size: 70px 70px, 70px 70px, auto, auto;
      opacity: 0.58;
      pointer-events: none;
    }

    .preview {
      position: relative;
      width: min(1080px, calc(100vw - 36px));
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(40px, 8vw, 92px) 0;
      display: grid;
      gap: clamp(48px, 8vw, 92px);
      align-content: center;
    }

    .top {
      display: flex;
      justify-content: center;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(380px, 520px);
      gap: clamp(36px, 5vw, 56px);
      align-items: center;
    }

    .copy h1 {
      max-width: 620px;
      margin: 0 0 24px;
      font-size: clamp(46px, 5vw, 66px);
      line-height: .92;
      letter-spacing: 0;
      text-shadow: 0 22px 62px rgba(0, 0, 0, 0.26);
    }

    .copy p {
      max-width: 560px;
      margin: 0;
      color: rgba(247, 237, 215, 0.78);
      font-size: 18px;
      line-height: 1.75;
      text-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
    }

    .shader-blob--card h2 {
      margin: 0 0 18px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
      text-shadow: 0 16px 42px rgba(0, 0, 0, 0.26);
    }

    .shader-blob--card p {
      margin: 0;
      color: rgba(247, 237, 215, 0.76);
      font-size: 17px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 34px;
    }

    @media (max-width: 820px) {
      .content {
        grid-template-columns: 1fr;
      }

      .shader-blob--nav {
        gap: 10px;
        padding-inline: 18px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="top">
      <nav class="shader-blob shader-blob--nav" aria-label="主导航">
        <a href="#">方法</a>
        <a href="#">场景</a>
        <a href="#">留学</a>
        <a href="#">联系</a>
      </nav>
    </div>

    <section class="content">
      <div class="copy">
        <h1>把光感交给 shader</h1>
        <p>这个预览只用一个很小的原生 WebGL fragment shader 画材质层，DOM 文字保持清晰。它更接近 sketch blob 的内部发光、低频体积云和边缘密度变薄，而不是普通 CSS 玻璃胶囊。</p>
        <div class="actions">
          <a class="shader-blob shader-blob--button" href="#">预约诊断</a>
          <a class="shader-blob shader-blob--button" href="#">查看方法</a>
        </div>
      </div>

      <article class="shader-blob shader-blob--card">
        <h2>光从内部长出来</h2>
        <p>多团 blob 密度场、fbm 噪声、乳白/鼠尾草绿/淡粉/琥珀色混合，并用轻量 canvas 只渲染可见组件。</p>
      </article>
    </section>
  </main>

  <script type="module" src="js/components/shader-blob-glass.js"></script>
</body>
</html>
