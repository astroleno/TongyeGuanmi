<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StarMap SceneProvider Harness｜同野观幂</title>
  <meta name="description" content="Standalone StarMap SceneProvider harness." />
  <meta name="theme-color" content="#07110e" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/back2.png" as="image" />
  <style>
    :root {
      color-scheme: dark;
      background: #07110e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07110e;
    }

    body {
      color: rgba(247, 237, 215, .86);
    }

    button {
      appearance: none;
      border: 1px solid rgba(247, 237, 215, .24);
      border-radius: 7px;
      padding: 8px 11px;
      color: rgba(247, 237, 215, .88);
      background: rgba(5, 8, 7, .48);
      font: inherit;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: rgba(232, 213, 154, .68);
      color: #fff3d4;
      outline: none;
      background: rgba(30, 45, 39, .68);
    }

    button:disabled {
      cursor: wait;
      opacity: .52;
    }

    .provider-harness {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .provider-harness__stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #07110e;
    }

    .starmap-provider-scene {
      position: absolute;
      inset: 0;
      display: grid;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 16% 22%, rgba(56, 166, 154, .12), transparent 32vw),
        radial-gradient(circle at 84% 74%, rgba(183, 91, 52, .10), transparent 34vw),
        linear-gradient(180deg, rgba(7, 17, 14, .96), #07110e),
        #07110e;
    }

    .starmap-provider-scene__canvas,
    .starmap-provider-scene__wash {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .starmap-provider-scene__canvas {
      z-index: 0;
      opacity: 0;
      filter: saturate(.98) contrast(1.04) brightness(.74);
      transform: scale(1.03);
      transition: opacity .42s ease;
    }

    .starmap-provider-scene__canvas.is-ready {
      opacity: .88;
    }

    .starmap-provider-scene__wash {
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5, 8, 7, .40) 0%, rgba(5, 8, 7, .12) 42%, rgba(5, 8, 7, .38) 100%),
        linear-gradient(180deg, rgba(5, 8, 7, .12) 0%, rgba(5, 8, 7, .04) 46%, rgba(5, 8, 7, .54) 100%);
    }

    .starmap-provider-scene__copy-wrap {
      position: relative;
      z-index: 2;
      width: min(1280px, 100%);
      margin-inline: auto;
      padding: clamp(96px, 10vw, 156px) clamp(26px, 7vw, 132px);
      opacity: 1;
      filter: blur(0);
      transform: translate3d(0, 0, 0);
      transition: opacity .18s ease, filter .18s ease, transform .18s ease;
    }

    .starmap-provider-scene__copy {
      width: min(1040px, 72vw);
      max-width: 16.8em;
      margin: 0;
      color: rgba(247, 237, 215, .72);
      font-family: ui-serif, "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      font-size: clamp(30px, 3.25vw, 52px);
      font-weight: 600;
      line-height: 1.42;
      letter-spacing: .012em;
      text-shadow: 0 2px 18px rgba(5, 8, 7, .24);
    }

    .provider-harness__panel {
      position: fixed;
      z-index: 20;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      pointer-events: none;
    }

    .provider-harness__status,
    .provider-harness__controls {
      pointer-events: auto;
      border: 1px solid rgba(247, 237, 215, .16);
      border-radius: 8px;
      background: rgba(5, 8, 7, .56);
      box-shadow: 0 16px 60px rgba(0, 0, 0, .24);
      backdrop-filter: blur(14px);
    }

    .provider-harness__status {
      min-width: 0;
      padding: 12px 14px;
    }

    .provider-harness__status strong {
      display: block;
      margin-bottom: 7px;
      color: rgba(232, 213, 154, .84);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .provider-harness__status code {
      display: block;
      overflow: hidden;
      color: rgba(247, 237, 215, .72);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .provider-harness__controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
      padding: 8px;
    }

    @media (max-width: 760px) {
      .starmap-provider-scene__copy {
        width: min(100%, 15.8em);
        font-size: clamp(26px, 7.6vw, 42px);
      }

      .provider-harness__panel {
        grid-template-columns: 1fr;
      }

      .provider-harness__controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="provider-harness" aria-label="StarMap provider harness">
    <section class="provider-harness__stage" data-starmap-provider-host aria-label="StarMap belief scene"></section>
    <aside class="provider-harness__panel" aria-label="Harness controls">
      <div class="provider-harness__status" aria-live="polite">
        <strong>Provider state</strong>
        <code data-provider-state>idle</code>
        <code data-provider-trace>idle</code>
      </div>
      <div class="provider-harness__controls">
        <button type="button" data-provider-action="poster">Poster</button>
        <button type="button" data-provider-action="reveal">Reveal</button>
        <button type="button" data-provider-action="loop">Loop</button>
        <button type="button" data-provider-action="cancel">Cancel</button>
        <button type="button" data-provider-action="reverse">Reverse</button>
        <button type="button" data-provider-action="remount">Destroy / remount</button>
      </div>
    </aside>
  </main>
  <script type="module">
    import { createStarmapSceneProvider } from './js/scene-providers/starmap-scene-provider.js';

    const host = document.querySelector('[data-starmap-provider-host]');
    const stateNode = document.querySelector('[data-provider-state]');
    const traceNode = document.querySelector('[data-provider-trace]');
    const buttons = [...document.querySelectorAll('[data-provider-action]')];
    let provider = createStarmapSceneProvider();
    let busy = false;

    const renderStatus = () => {
      const snapshot = provider.getState();
      stateNode.textContent = `${snapshot.status} / ${(snapshot.progress * 100).toFixed(0)}%`;
      traceNode.textContent = snapshot.trace.join(' -> ');
    };

    const setBusy = (value) => {
      busy = value;
      buttons.forEach((button) => { button.disabled = value; });
    };

    const run = async (task) => {
      if (busy) return;
      setBusy(true);
      try {
        await task();
      } finally {
        renderStatus();
        setBusy(false);
      }
    };

    const waitMs = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

    const mountPoster = async () => {
      await provider.mount({ host, onTrace: renderStatus });
      await provider.showPoster({});
      renderStatus();
    };

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.dataset.providerAction;
        if (action === 'poster') run(() => provider.showPoster({}));
        if (action === 'reveal') run(() => provider.playReveal({}));
        if (action === 'loop') {
          void provider.playLoop({}).catch(() => {});
          renderStatus();
        }
        if (action === 'cancel') run(() => provider.cancelToPoster({}));
        if (action === 'reverse') run(() => provider.reverseToPoster({}));
        if (action === 'remount') {
          run(async () => {
            provider.destroy();
            provider = createStarmapSceneProvider();
            window.starmapSceneProvider = provider;
            await mountPoster();
          });
        }
      });
    });

    window.__starmapProviderHarnessRunAcceptance = async () => {
      await provider.showPoster({});
      await provider.playReveal({});
      const loop = provider.playLoop({});
      await waitMs(420);
      await provider.cancelToPoster({});
      await loop;
      await provider.playReveal({});
      await provider.reverseToPoster({});
      provider.destroy();
      provider = createStarmapSceneProvider();
      window.starmapSceneProvider = provider;
      await mountPoster();
      return provider.getState();
    };

    window.__starmapProviderHarnessCapture = async (name) => {
      if (name === 'poster') await provider.showPoster({});
      if (name === 'reveal') await provider.playReveal({ durationMs: 860 });
      if (name === 'loop') {
        void provider.playLoop({}).catch(() => {});
        await waitMs(620);
      }
      if (name === 'cancel') {
        const controller = new AbortController();
        const play = provider.playReveal({
          signal: controller.signal,
          onProgress(progress) {
            if (progress > .42 && !controller.signal.aborted) controller.abort();
          }
        }).catch(() => {});
        await play;
        await provider.cancelToPoster({});
      }
      renderStatus();
      return provider.getState();
    };

    await mountPoster();
    window.starmapSceneProvider = provider;
    window.__starmapProviderHarnessReady = true;
  </script>
</body>
</html>
