<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll Edge Blur Nav Demo｜同野观幂</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    :root {
      --nav-h: 60px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #07110e;
    }

    body {
      overflow-x: hidden;
    }

    .site-nav {
      opacity: 1 !important;
      visibility: visible !important;
      transform: none !important;
      pointer-events: auto !important;
    }

    .scroll-edge-blur {
      opacity: 1 !important;
      visibility: visible !important;
    }

    .demo-stage {
      position: relative;
      min-height: 360vh;
      color: #f7edd7;
      background: transparent;
    }

    .demo-backdrop {
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(90deg,
          #f7edd7 0 16px,
          #07110e 16px 32px,
          #38a69a 32px 48px,
          #b75b34 48px 64px);
      pointer-events: none;
    }

    .demo-band {
      min-height: 100vh;
      padding: 160px clamp(24px, 8vw, 120px) 80px;
      display: grid;
      align-items: start;
      position: relative;
      overflow: hidden;
    }

    .demo-band::before {
      content: none;
    }

    .demo-band::after {
      content: none;
    }

    .demo-band.is-light {
      color: #06100d;
      background:
        radial-gradient(circle at 72% 9%, rgba(56, 166, 154, .34), transparent 22vw),
        linear-gradient(135deg, #f7edd7 0%, #e8d59a 42%, #bdd7cd 100%);
    }

    .demo-band.is-light::before {
      content: none;
    }

    .demo-copy {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      margin-inline: auto;
      text-align: center;
    }

    .demo-copy h1,
    .demo-copy h2 {
      margin: 0;
      font-size: clamp(46px, 8vw, 112px);
      font-weight: 420;
      line-height: .94;
      letter-spacing: 0;
    }

    .demo-copy p {
      width: min(620px, 100%);
      margin: 28px auto 0;
      font-size: 16px;
      line-height: 1.8;
      opacity: .76;
    }

    .demo-floating-text {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      justify-content: space-around;
      gap: 20px;
      color: currentColor;
      opacity: .82;
      font-size: clamp(34px, 8vw, 96px);
      font-weight: 760;
      white-space: nowrap;
      pointer-events: none;
    }

    .demo-controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(247, 237, 215, .16);
      border-radius: 999px;
      background: rgba(5, 8, 7, .62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .demo-controls button {
      min-height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(247, 237, 215, .76);
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }

    .demo-controls button.is-active {
      background: #e8d59a;
      color: #06100d;
    }

    @media (max-width: 680px) {
      .demo-band {
        padding-top: 138px;
      }

      .demo-floating-text {
        top: 22px;
      }

      .demo-controls {
        left: 12px;
        right: 12px;
        justify-content: center;
      }

      .demo-controls button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="demo-backdrop" aria-hidden="true"></div>
  <nav class="site-nav has-scroll-edge-blur" aria-label="主导航">
    <div class="site-nav-track">
      <a class="brand" href="#top" aria-label="同野观幂首页">
        <span class="brand-mark">同</span>
        <span class="brand-text">同野观幂</span>
      </a>
      <div class="nav-links" aria-label="页面章节">
        <a href="#method">方法</a>
        <a href="#services">场景</a>
        <a href="#education">留学</a>
        <a href="#contact">联系</a>
      </div>
      <a class="nav-cta" href="#contact">预约诊断</a>
    </div>
  </nav>
  <div class="scroll-edge-blur" aria-hidden="true">
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__layer"></span>
    <span class="scroll-edge-blur__tint"></span>
  </div>

  <main id="top" class="demo-stage">
    <section class="demo-band" data-tone="dark">
      <div class="demo-floating-text" aria-hidden="true">
        <span>EDGE</span><span>BLUR</span><span>羽化</span>
      </div>
      <div class="demo-copy">
        <h1>Scroll Edge</h1>
        <p>向下滚动，看大字和高对比背景穿过顶栏时被逐步模糊。右下角可以切回原渐变作对比。</p>
      </div>
    </section>

    <section class="demo-band is-light" id="method" data-tone="light">
      <div class="demo-floating-text" aria-hidden="true">
        <span>LIGHT</span><span>TONE</span><span>浅色</span>
      </div>
      <div class="demo-copy">
        <h2>Light Tone</h2>
        <p>浅色段会切换导航文字和 tint，用来模拟主页中浅色章节下的顶栏表现。</p>
      </div>
    </section>

    <section class="demo-band" id="services" data-tone="dark">
      <div class="demo-floating-text" aria-hidden="true">
        <span>DARK</span><span>INK</span><span>深色</span>
      </div>
      <div class="demo-copy">
        <h2>Dark Tone</h2>
        <p>目标就是 iOS 26 那种渐进式模糊：让内容穿过顶栏时逐步失焦，tint 只保留一点点对比度。</p>
      </div>
    </section>
  </main>

  <div class="demo-controls" aria-label="顶栏效果切换">
    <button type="button" id="legacyBtn">原渐变</button>
    <button type="button" id="edgeBtn" class="is-active">羽化</button>
  </div>

  <script>
    (function () {
      var nav = document.querySelector('.site-nav');
      var edge = document.querySelector('.scroll-edge-blur');
      var legacyBtn = document.getElementById('legacyBtn');
      var edgeBtn = document.getElementById('edgeBtn');
      var sections = Array.prototype.slice.call(document.querySelectorAll('[data-tone]'));

      function setEdge(enabled) {
        nav.classList.toggle('has-scroll-edge-blur', enabled);
        edge.hidden = !enabled;
        legacyBtn.classList.toggle('is-active', !enabled);
        edgeBtn.classList.toggle('is-active', enabled);
      }

      function syncTone() {
        var probe = Math.min(window.innerHeight * .14, 120);
        var tone = 'dark';
        for (var i = 0; i < sections.length; i += 1) {
          var rect = sections[i].getBoundingClientRect();
          if (rect.top <= probe && rect.bottom > probe) {
            tone = sections[i].dataset.tone || 'dark';
            break;
          }
        }
        nav.dataset.tone = tone;
        nav.classList.toggle('is-on-light', tone === 'light');
      }

      legacyBtn.addEventListener('click', function () { setEdge(false); });
      edgeBtn.addEventListener('click', function () { setEdge(true); });
      window.addEventListener('scroll', syncTone, { passive: true });
      window.addEventListener('resize', syncTone);
      syncTone();
    })();
  </script>
</body>
</html>
