<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="256" viewBox="0 0 1600 256" preserveAspectRatio="none">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dac9"/>
      <stop offset="0.38" stop-color="#d8cfbf"/>
      <stop offset="1" stop-color="#c7bba9"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8947e" stop-opacity=".16"/>
      <stop offset=".22" stop-color="#f3e9d4" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff8e8" stop-opacity=".08"/>
      <stop offset=".78" stop-color="#b29c83" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7b6655" stop-opacity=".2"/>
    </linearGradient>
    <pattern id="grain" width="64" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 6h64M0 22h64" stroke="#8e7d6b" stroke-opacity=".2" stroke-width="3"/>
      <path d="M8 0v32M40 0v32" stroke="#fff4dc" stroke-opacity=".24" stroke-width="6"/>
      <path d="M24 0v32M56 0v32" stroke="#766454" stroke-opacity=".18" stroke-width="3"/>
      <path d="M0 15l18-5 22 6 24-8" fill="none" stroke="#6f5c4d" stroke-opacity=".18" stroke-width="3"/>
    </pattern>
    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .12" numOctaves="2" seed="17" result="n"/>
      <feColorMatrix in="n" values=".22 0 0 0 .46 .22 0 0 0 .42 .18 0 0 0 .36 0 0 0 .22 0"/>
    </filter>
  </defs>
  <rect width="1600" height="256" fill="url(#floor)"/>
  <rect width="1600" height="256" fill="url(#light)"/>
  <rect width="1600" height="256" fill="url(#grain)" opacity=".8"/>
  <rect width="1600" height="256" filter="url(#noise)" opacity=".42"/>
