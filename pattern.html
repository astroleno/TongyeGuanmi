<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同野观幂｜万花筒背景</title>
  <meta name="description" content="同野观幂万花筒背景路由。" />
  <meta name="theme-color" content="#d9c08f" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/qiji-title-subset.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/patterns/backgrounds/aged-mottled-background-16x9-4k.png" as="image" />
  <link rel="preload" href="assets/patterns/alpha-layers/pattern-layer-alpha-06.png" as="image" />
  <link rel="stylesheet" href="css/pattern.css" />
</head>
<body>
  <main class="pattern-page" aria-label="同野观幂万花筒背景">
    <div class="pattern-stage" aria-hidden="true">
      <div class="pattern-layer-frame pattern-layer-frame--even pattern-layer-06">
        <img src="assets/patterns/alpha-layers/pattern-layer-alpha-06.png" width="1278" height="941" alt="" />
      </div>
      <div class="pattern-layer-frame pattern-layer-frame--odd pattern-layer-05">
        <img src="assets/patterns/alpha-layers/pattern-layer-alpha-05.png" width="1136" height="935" alt="" />
      </div>
      <div class="pattern-layer-frame pattern-layer-frame--even pattern-layer-04">
        <img src="assets/patterns/alpha-layers/pattern-layer-alpha-04.png" width="1672" height="941" alt="" />
      </div>
      <div class="pattern-layer-frame pattern-layer-frame--odd pattern-layer-03">
        <img src="assets/patterns/alpha-layers/pattern-layer-alpha-03.png" width="1672" height="941" alt="" />
      </div>
      <div class="pattern-layer-frame pattern-layer-frame--even pattern-layer-02">
        <img src="assets/patterns/alpha-layers/pattern-layer-alpha-02.png" width="1672" height="941" alt="" />
      </div>
    </div>

    <nav class="pattern-nav" aria-label="页面导航">
      <a class="pattern-brand" href="/" aria-label="返回同野观幂首页">
        <span class="pattern-brand-mark">同</span>
        <span>同野观幂</span>
      </a>
      <a class="pattern-back" href="/">首页</a>
    </nav>

    <section class="pattern-control-panel" aria-label="图层调节面板">
      <label class="pattern-control">
        <span>05 X</span>
        <input type="range" min="-420" max="420" step="1" value="0" data-pattern-control data-layer="05" data-prop="x" />
        <output>0px</output>
      </label>
      <label class="pattern-control">
        <span>05 Y</span>
        <input type="range" min="-420" max="420" step="1" value="0" data-pattern-control data-layer="05" data-prop="y" />
        <output>0px</output>
      </label>
      <label class="pattern-control">
        <span>05 Scale</span>
        <input type="range" min="0.50" max="1.80" step="0.01" value="1.15" data-pattern-control data-layer="05" data-prop="scale" />
        <output>1.15x</output>
      </label>
      <label class="pattern-control">
        <span>06 X</span>
        <input type="range" min="-420" max="420" step="1" value="0" data-pattern-control data-layer="06" data-prop="x" />
        <output>0px</output>
      </label>
      <label class="pattern-control">
        <span>06 Y</span>
        <input type="range" min="-420" max="420" step="1" value="0" data-pattern-control data-layer="06" data-prop="y" />
        <output>0px</output>
      </label>
      <label class="pattern-control">
        <span>06 Scale</span>
        <input type="range" min="0.50" max="1.80" step="0.01" value="1.10" data-pattern-control data-layer="06" data-prop="scale" />
        <output>1.10x</output>
      </label>
    </section>
  </main>
  <script type="module" src="js/pattern-controls.js"></script>
</body>
</html>
